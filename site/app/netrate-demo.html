  inline-size: 64px; block-size: 64px; margin-block-end: 6px; border-radius: 20px; display: grid; place-items: center;
  color: var(--accent); background: var(--accent-wash);
}
.pick-card b { font-size: 18px; font-weight: var(--w-bold); line-height: 1.5; }
.pick-sub { font-size: 13.5px; line-height: 1.85; color: var(--ink-3); }
.pick-tag {
  position: absolute; inset-block-start: 12px; inset-inline-end: 12px; padding: 2px 10px; border-radius: var(--r-pill);
  font-style: normal; font-size: 11.5px; font-weight: var(--w-semi); line-height: 1.8; color: var(--accent);
  background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent-line);
}
.pick-foot { margin: 24px 0 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; font-size: 13px; color: var(--ink-3); }
.pick-lang {
  min-block-size: 44px; padding-inline: 18px; border-radius: var(--r-pill); font-size: 13px; font-weight: var(--w-semi);
  color: var(--ink-2); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--hair);
}
.pick-lang:active { transform: scale(0.96); }

html[data-view="phone"] {
  --sb-top: max(env(safe-area-inset-top, 0px), 12px);
  --trim: calc(50px - var(--sb-top));
  overscroll-behavior: none;
}
html[data-view="phone"] body { overflow: hidden; overscroll-behavior: none; }
html[data-view="phone"] body.v2 { display: block; min-block-size: 0; }
html[data-view="phone"] .device {
  position: fixed; inset: 0; margin-inline: auto; inline-size: min(100vw, 480px); block-size: 100vh; block-size: 100dvh;
  border-radius: 0; box-shadow: none;
}

html[data-view="phone"] .status { display: none; }
html[data-view="phone"] .app { inset-block-start: calc(var(--trim) * -1); }
html[data-view="phone"] .toast { inset-block-start: calc(var(--sb-top) + 8px); }
html[data-view="phone"] .srch { padding-block-start: var(--sb-top); }
html[data-view="phone"] .tabbar { padding-block-end: calc(22px + env(safe-area-inset-bottom, 0px)); }

html[data-view="phone"] .demo {
  position: fixed; z-index: 91; inset-inline: 0; inset-block-end: 0; inline-size: auto; max-inline-size: 520px; margin-inline: auto;
  max-block-size: 82vh; max-block-size: 82dvh; padding-block-end: calc(22px + env(safe-area-inset-bottom, 0px));
  border-radius: 28px 28px 0 0; transform: translateY(105%); visibility: hidden;
  transition: transform 520ms var(--sp-smooth), visibility 0s linear 520ms;
}
html[data-view="phone"] .demo.open { transform: none; visibility: visible; transition: transform 520ms var(--sp-smooth), visibility 0s; }
html[data-view="phone"] .demo.instant { transition: none !important; }
html[data-view="phone"] .demo-x { display: grid; }
@media (min-width: 980px) { html[data-view="phone"] .demo-back:not([hidden]) { display: block !important; } }

html[data-view="desktop"] body.v2 { padding: 24px; box-sizing: border-box; overflow-x: hidden; }
html[data-view="desktop"] .fit {
  display: block; position: relative; flex: none; inline-size: 390px; block-size: 844px;
  transform: scale(var(--k, 1)); transform-origin: 0 0;

  margin-right: calc(-390px * (1 - var(--k, 1))); margin-bottom: calc(-844px * (1 - var(--k, 1)));
}
html[data-view="desktop"] .device { inline-size: 390px; block-size: 844px; border-radius: 54px; box-shadow: var(--bezel); }
@media (min-width: 980px) { html[data-view="desktop"] .demo { max-block-size: calc(100dvh - 48px); } }

.fab {
  display: none; position: fixed; z-index: 80; top: auto; bottom: calc(30px + env(safe-area-inset-bottom, 0px));
  right: 10px; left: auto; align-items: center; gap: 0;
  block-size: 46px; min-inline-size: 46px; padding-inline: 12px; border-radius: 23px; touch-action: none; user-select: none;
  color: var(--ink); background: color-mix(in srgb, var(--paper) 78%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: inset 0 0 0 1px var(--hair-2), var(--sh-float);
  transition: opacity 200ms, transform 300ms var(--sp-press), gap 300ms var(--sp-smooth);
}
html[data-view="phone"] .fab { display: inline-flex; }
@media (max-width: 979px) { html[data-view="desktop"] .fab { display: inline-flex; } }
.fab:active { transform: scale(0.94); }
.fab.moving { transition: opacity 200ms; }
.fab-t { max-inline-size: 0; overflow: hidden; white-space: nowrap; opacity: 0; font-size: 13.5px; font-weight: var(--w-semi); transition: max-inline-size 400ms var(--sp-smooth), opacity 250ms; }
.fab.hint { gap: 8px; }
.fab.hint .fab-t { max-inline-size: 140px; opacity: 1; }

body:has(.demo.open) .fab, body:has(.device.has-sheet) .fab, body:has(#onb:not([hidden])) .fab,
body:has(#splash:not([hidden])) .fab, body:has(#srch:not([hidden])) .fab { opacity: 0; pointer-events: none; }
html[data-view="choose"] .fab { display: none; }
html.rm .fab, html.rm .fab-t { transition: none; }

.demo .opts button svg { flex: none; }

</style>

var Offices2 = function (ctx) {
  "use strict";

  var K = NRK2, $ = K.$, qa = K.qa, fa = K.fa, I = K.I, num = K.num, esc = K.esc;
  var N = NetRateEngine, EX = N.EX, CUR = N.CUR, TYPE = N.TYPE;
  var t = ctx.t, SEP = ctx.SEP, NOW = ctx.NOW;

  var S = {
    q: "", city: "", openNow: false, verified: false,
    sort: "alpha",
    ads: false, view: "h1",
    ex: null,
    dcur: "gbp",
    range: 7
  };
  var D = { cur: "gbp", type: "cash", dir: "send", amount: 0, sort: "best", featBest: false };
  var DE = N.bind(D);
  var WEEK_ORDER = K.en ? [1, 2, 3, 4, 5, 6, 0] : [6, 0, 1, 2, 3, 4, 5];

  function hm(m) { return num(fa(Math.floor(m / 60)) + ":" + K.faDigits(String(m % 60 + 100).slice(1))); }
  function km(v) { return t("ix.km", { n: num(fa(v, v < 10 ? 1 : 0)) }); }
  function money(v, metal) { return metal ? fa(v, 2) : fa(Math.round(v)); }

  function openPill(o, long) {
    if (o.gone) return '<span class="open-pill">' + STR.ix.gone + "</span>";
    if (o.open) return '<span class="open-pill on"><i></i>' + t("ix.openUntil", { t: hm(o.closes) }) + "</span>";
    var when;
    if (o.today) when = long ? t("ix.closedAt", { t: hm(o.opens) }) : t("ix.opensAt", { t: hm(o.opens) });
    else if (o.day === (NOW.dow + 1) % 7) when = t("ix.closedTomorrow", { t: hm(o.opens) });
    else when = t("ix.closedDay", { d: STR.weekdays[o.day], t: hm(o.opens) });
    return '<span class="open-pill"><i></i>' + when + "</span>";
  }
  function ratingHtml(ex) {
    return '<span class="rating">' + I("starfill", 13) + "<b>" + num(fa(ex.score, 1)) + "</b>" +
      '<span class="n">' + t("ix.reviews", { n: num(fa(N.reviewCount(ex))) }) + "</span></span>";
  }
  function freshHtml(ex) {
    return N.alwaysFresh(ex) ? '<span class="fresh">' + I("check", 13) + STR.ix.fresh + "</span>" : "";
  }

  var cards = {};

  function cardEl(ex) {
    if (cards[ex.id]) return cards[ex.id];
    var el = document.createElement("div");
    el.className = "xc";
    el.setAttribute("role", "listitem");
    el.dataset.id = ex.id;
    el.innerHTML = '<span class="av" aria-hidden="true"></span><span class="id"><span class="nm"></span><span class="loc"></span></span>' +
      '<span class="go" aria-hidden="true">' + I("chevron", 16) + '</span><span class="row"><span class="st"></span><span class="meta"></span></span>' +
      '<button type="button" class="xc-hit"></button>';
    el.querySelector(".xc-hit").addEventListener("click", function () { ctx.push(ex.id); });
    cards[ex.id] = el;
    return el;
  }

  function locText(row) {
    var ex = row.ex, all = N.profile(ex.id).branches, txt;
    if (!S.city) {
      var main = N.mainBranch(ex), more = all.length - 1;
      var mc = esc(K.city(main.city));
      txt = more === 1 ? t("ix.locMore1", { c: mc })
        : more > 1 ? t("ix.locMore", { c: mc, n: num(fa(more)) }) : mc;
    } else if (row.branches.length > 1) {
      txt = t("ix.locIn", { n: num(fa(row.branches.length)), c: esc(K.city(S.city)) });
    } else {
      txt = row.branches[0].main ? esc(K.city(S.city)) : t("ix.locBranch", { c: esc(K.city(S.city)) });
    }
    if (S.sort === "near") {
      var near = Math.min.apply(null, row.branches.map(function (b) { return b.km; }));
      txt += SEP + km(near);
    }
    return txt;
  }

  function fillCard(el, row) {
    var ex = row.ex, gone = ex.st === "inactive";
    el.classList.toggle("gone", gone);
    el.querySelector(".av").textContent = K.exIni(ex);
    el.querySelector(".nm").innerHTML = "<span>" + esc(K.exName(ex)) + "</span>" +
      (ex.ver ? '<span class="ver">' + I("verified", 15) + "</span>" : "");
    el.querySelector(".loc").innerHTML = locText(row);
    el.querySelector(".st").innerHTML = gone ? "" : openPill(row.open, false);
    el.querySelector(".meta").innerHTML = ratingHtml(ex) + (gone ? '<span class="pill">' + STR.ix.gone + "</span>" : freshHtml(ex));
    el.querySelector(".xc-hit").setAttribute("aria-label", K.exName(ex) + (ex.ver ? " " + STR.ix.verified : ""));
  }

  function rows() {
    return K.indexList({ q: S.q, city: S.city, openNow: S.openNow, verified: S.verified, sort: S.sort, now: NOW });
  }

  function renderIndex(opts) {
    opts = opts || {};
    var list = $("ixList"), r = rows();
    var apply = function () {
      var keep = {};
      r.forEach(function (row) {
        var el = cardEl(row.ex);
        fillCard(el, row);
        list.appendChild(el);
        keep[row.ex.id] = 1;
      });
      Object.keys(cards).forEach(function (id) {
        if (!keep[id] && cards[id].parentNode === list) list.removeChild(cards[id]);
      });
    };
    if (opts.noFlip) apply(); else K.flip(list, apply);

    var bits = [S.city ? t("ix.countIn", { n: num(fa(r.length)), c: esc(K.city(S.city)) }) : t("ix.count", { n: num(fa(r.length)) })];
    if (S.openNow) bits.push(STR.ix.openNow);
    if (S.verified) bits.push(STR.ix.verified);
    if (S.sort !== "alpha") bits.push(t("ix.byOrder", { s: STR.ix.sort[S.sort] }));
    $("ixCount").innerHTML = bits.join(SEP);

    $("ixCityLabel").textContent = K.city(S.city) || STR.ix.allCities;
    $("ixCity").classList.toggle("on", !!S.city);
    $("ixCity").setAttribute("aria-label", t("ix.cityAria", { v: K.city(S.city) || STR.ix.allCities }));
    var nf = (S.openNow ? 1 : 0) + (S.verified ? 1 : 0);
    $("ixFilter").classList.toggle("on", nf > 0);
    $("ixFilterCt").textContent = nf ? fa(nf) : "";
    $("ixFilter").setAttribute("aria-label", nf ? t("ix.filterOnAria", { n: fa(nf) }) : STR.ix.filter);
    $("ixSortLabel").textContent = STR.ix.sortShort[S.sort];
    $("ixSort").setAttribute("aria-label", t("mnu.sortAria", { v: STR.ix.sort[S.sort] }));
    $("ixSearchWrap").classList.toggle("has", !!S.q);
    $("ixSub").innerHTML = t("ix.sub", { n: num(fa(EX.filter(N.listed).length)), c: num(fa(N.CITIES.length)) });
    renderIndexView(r.length);
  }

  function renderIndexView(count) {
    var v = S.view;
    if (count === undefined) count = rows().length;
    var show = function (id, on) { $(id).hidden = !on; };
    var content = v === "h1" || v === "h5" || v === "h3" || v === "h7";
    show("ixOffline", v === "h5");
    show("ixSearchWrap", v !== "h4");
    show("ixAd", S.ads && v !== "h4");
    show("ixControls", v !== "h4");
    show("ixCount", content && count > 0);
    show("ixList", content && count > 0);
    show("ixSk", v === "h2");
    show("ixEmpty", content && count === 0);
    show("ixError", v === "h4");
  }

  function buildSkeletons() {
    var sk = "";
    for (var i = 0; i < 6; i++) {
      sk += '<div class="xc skel"><span class="av"></span><span class="id">' +
        '<span class="sk" style="inline-size:' + (110 + (i * 37) % 60) + 'px;block-size:14px;margin-block:4px 8px"></span>' +
        '<span class="sk" style="inline-size:' + (80 + (i * 23) % 40) + 'px;block-size:10px"></span></span><span class="go"></span>' +
        '<span class="row"><span class="sk" style="inline-size:96px;block-size:22px;border-radius:999px"></span>' +
        '<span class="sk" style="inline-size:120px;block-size:12px"></span></span></div>';
    }
    $("ixSk").innerHTML = sk;
    var d = '<div class="dt-hero"><span class="sk" style="inline-size:76px;block-size:76px;border-radius:24px"></span>' +
      '<span class="sk" style="inline-size:170px;block-size:22px;margin-block-start:12px"></span>' +
      '<span class="sk" style="inline-size:120px;block-size:12px;margin-block-start:10px"></span></div><div class="dt-acts">';
    for (var j = 0; j < 4; j++) d += '<span class="sk" style="block-size:74px;border-radius:20px"></span>';
    d += "</div>";
    for (var k = 0; k < 2; k++) {
      d += '<div class="card dt-sec"><span class="sk" style="inline-size:96px;block-size:14px;margin-block-end:16px"></span>' +
        '<span class="sk" style="inline-size:100%;block-size:11px;margin-block-end:10px"></span>' +
        '<span class="sk" style="inline-size:78%;block-size:11px;margin-block-end:10px"></span>' +
        '<span class="sk" style="inline-size:58%;block-size:11px"></span></div>';
    }
    $("dtSk").innerHTML = d;
  }

  function countIf(patch) {
    var keep = { city: S.city, openNow: S.openNow, verified: S.verified };
    Object.keys(patch).forEach(function (k) { S[k] = patch[k]; });
    var n = rows().length;
    Object.keys(keep).forEach(function (k) { S[k] = keep[k]; });
    return n;
  }
  K.menu({
    host: ctx.device, trigger: $("ixCity"), label: $("ixCityLabel"), width: 284,

    if (want !== S.tab && ["offices", "chart", "me"].indexOf(want) >= 0) { showTab(want); bar.place(false); }
  })();

  var resume = null;
  try { resume = JSON.parse(sessionStorage.getItem(RESUME_KEY) || "null"); sessionStorage.removeItem(RESUME_KEY); } catch (e) { resume = null; }
  if (resume) {
    if (resume.at === "language") account.open(["language"], true);
    if (resume.at === "demo") { demo.classList.add("instant"); demoOpen(true); requestAnimationFrame(function () { demo.classList.remove("instant"); }); }
    if (resume.at === "fresh") account.freshInstall();
    if (!K.reduced()) {
      K.anim(device, [{ transform: "scale(1.04)", opacity: 0, filter: "blur(6px)" }, { transform: "none", opacity: 1, filter: "blur(0)" }],
        { spring: "smooth" });
    }
  }

  var splash = $("splash"), seen = false;
  try { seen = sessionStorage.getItem("nr2-intro") === "1"; } catch (e) { seen = true; }
  if (!seen && !K.reduced()) {
    try { sessionStorage.setItem("nr2-intro", "1"); } catch (e) {}
    splash.hidden = false;
    splash.classList.add("on");
    var done = false;
    var finish = function () {
      if (done) return;
      done = true;
      splash.classList.add("out");
      arrive();
      setTimeout(function () { splash.hidden = true; splash.classList.remove("on", "out"); }, 480);
    };
    splash.addEventListener("click", finish);
    setTimeout(finish, 1150);
  } else {
    arrive();
  }

  window.__netrate = { S: S, E: E, render: renderAll, tick: tick, openOffice: openOffice, selectTab: selectTab, setView: setView, chart: chart, me: me, search: search, favs: favs,
    lang: function () { return K.lang; }, setLang: setLang, t: t,
    isReady: function () { return ready; }, push: push, pop: pop, offices: offices, isPushed: function () { return !!stack; }, account: account,
    demo: demoOpen, relaunch: relaunch };
})();

</script>
